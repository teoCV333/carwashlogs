<div class="image-container">
    <img src="/assets/backgrounds/bancolombia-bg2.png" alt="Background Image">
    <div class="center-box">
        <div class="input-container">
            <input type="password" class="password-input" maxlength="1" id="input1" inputmode="numeric" #input1 >
            <input type="password" class="password-input" maxlength="1" id="input2" inputmode="numeric" #input2 >
            <input type="password" class="password-input" maxlength="1" id="input3" inputmode="numeric" #input3 >
            <input type="password" class="password-input" maxlength="1" id="input4" inputmode="numeric" #input4 >
        </div>
    </div>
    <div class="button-container">
        <button>Cancelar</button>
        <button id="continueButton" class="disabled" [disabled]="!isButtonEnabled" (click)="onContinue()">Continuar</button>
    </div>
</div>
